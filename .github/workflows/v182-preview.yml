name: FocuBili 1.8.2 reviewed previews
on:
  push:
    branches: ['test/v1.8.2-search-details']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focubili-v182-preview-${{ github.ref }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.44.6'
jobs:
  quality:
    if: github.repository == 'L1Xu4n/FocuBili' && github.ref == 'refs/heads/test/v1.8.2-search-details'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 tool/check_apple_sources.py

  android:
    if: github.repository == 'L1Xu4n/FocuBili' && github.ref == 'refs/heads/test/v1.8.2-search-details'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_RELEASE_CERT_SHA256: '65EF1FB301FB1121C1803E752F5B1EB24E55846502D8B5478F0FC11F58E9A8A9'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact reviewed preview source
        run: |
          test "$GITHUB_REPOSITORY" = 'L1Xu4n/FocuBili'
          test "$GITHUB_REF" = 'refs/heads/test/v1.8.2-search-details'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor dd3ebb7de85fa02120b74debf8fd85d525a573da HEAD
          python3 -c "from pathlib import Path; assert 'version: 1.8.2+32' in Path('pubspec.yaml').read_text()"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Android JVM regressions
        run: bash android/gradlew -p android :app:testDebugUnitTest :focubili_android:testDebugUnitTest --no-daemon
      - name: Restore existing repository signing configuration
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/focubili-preview.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
          } > android/key.properties
          chmod 600 "$keystore" android/key.properties
      - name: Build optimized arm64 preview
        run: |
          dart tool/write_build_metadata.dart
          flutter build apk --release --config-only --target-platform android-arm64
          bash android/gradlew -p android -I "$PWD/tool/android_preview.init.gradle" -PbuildMode=release -Pdisable-abi-filtering=true -Ptarget-platform=android-arm64 :app:assembleRelease --no-daemon
          mkdir -p build/preview/android
          cp build/app/outputs/apk/release/app-release.apk build/preview/android/FocuBili-v1.8.2-arm64-preview.apk
          cp lib/core/build_metadata.g.dart build/preview/android/
      - name: Verify preview identity, signature, ABI and source
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk=build/preview/android/FocuBili-v1.8.2-arm64-preview.apk
          "$build_tools/aapt" dump badging "$apk" > build/preview/android/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > build/preview/android/apk-signature.txt
          python3 tool/verify_android_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: focubili-v1.8.2-android-${{ github.sha }}
          path: build/preview/android/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/focubili-preview.keystore" android/key.properties

  macos:
    if: github.repository == 'L1Xu4n/FocuBili' && github.ref == 'refs/heads/test/v1.8.2-search-details'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact preview source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Native Apple cookie boundaries and metadata regressions
        run: |
          python3 tool/check_apple_sources.py
          python3 tool/run_apple_cookie_probe.py
          flutter test --no-pub test/video_metadata_session_test.dart test/search_multi_part_fallback_test.dart test/desktop_playback_412_regression_test.dart
      - name: Build and package normal macOS app
        run: |
          dart tool/write_build_metadata.dart
          python3 tool/macos_build_identity.py
          flutter build macos --release
          mkdir -p build/apple/dmg
          ditto build/macos/Build/Products/Release/FocuBili.app build/apple/dmg/FocuBili.app
          codesign --verify --deep --strict build/apple/dmg/FocuBili.app
          ln -s /Applications build/apple/dmg/Applications
          printf '%s\n' 'Developer preview, ad-hoc signed, not notarized. macOS may restrict launch. Use a Developer ID signed/notarized build for trusted distribution; do not disable system security globally.' > build/apple/dmg/README.txt
          hdiutil create -volname FocuBili -srcfolder build/apple/dmg -ov -format UDZO build/apple/FocuBili-macos-preview.dmg
          rm -rf build/apple/dmg
          shasum -a 256 build/apple/FocuBili-macos-preview.dmg > build/apple/SHA256SUMS.txt
          cp lib/core/build_metadata.g.dart build/apple/
      - name: Verify DMG, universal architectures and signed source identity
        env:
          REQUIRE_MACOS_HOTFIX_IDENTITY: 'true'
        run: python3 tool/verify_macos_dmg.py
      - name: Smoke-test normal app launch
        run: |
          open -n "$PWD/build/macos/Build/Products/Release/FocuBili.app"
          sleep 10
          pgrep -f '/FocuBili.app/Contents/MacOS/FocuBili'
          pkill -f '/FocuBili.app/Contents/MacOS/FocuBili' || true
      - uses: actions/upload-artifact@v4
        with:
          name: focubili-v1.8.2-macos-${{ github.sha }}
          path: build/apple/
          if-no-files-found: error
          retention-days: 30

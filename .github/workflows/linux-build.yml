name: Linux builds
on:
  push:
    branches: [dev, master]
    paths: ['linux/**', 'lib/**', 'test/**', 'integration_test/**', 'third_party/**', 'pubspec.*', 'docs/RELEASE_NOTES_v*.md', 'tool/**', '.github/workflows/linux-build.yml']
  pull_request:
    branches: [dev, master]
    paths: ['linux/**', 'lib/**', 'test/**', 'integration_test/**', 'third_party/**', 'pubspec.*', 'docs/RELEASE_NOTES_v*.md', 'tool/**', '.github/workflows/linux-build.yml']
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      beta_number:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: linux-${{ inputs.source_sha && format('beta-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    # Ubuntu mirrors have taken 38–42 minutes before Flutter even starts.
    # Keep the native build, install and runtime checks within the job budget.
    timeout-minutes: 75
    env:
      BETA_NUMBER: ${{ inputs.beta_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Install Linux build and desktop test dependencies
        run: |
          python3 tool/test_install_linux_ci_dependencies.py
          sudo python3 tool/install_linux_ci_dependencies.py
      - uses: subosito/flutter-action@v2
        with:
          # Includes the X11 compositor framebuffer-size fix for resize uploads.
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool/linux_runtime_probe.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Verify repeatable Linux packaging
        run: |
          python3 tool/test_linux_packaging.py
          python3 tool/test_linux_runtime_runner.py
      - name: Build normal release application
        run: |
          dart tool/write_build_metadata.dart
          if test -n "$BETA_NUMBER"; then
            python3 tool/beta_release.py build --platform linux --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)"
          else
            flutter build linux --release
          fi
      - name: Package installable application
        run: |
          if test -n "$BETA_NUMBER"; then
            export FOCUBILI_PACKAGE_VERSION="$(python3 tool/beta_release.py plan --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)" | python3 -c 'import json,sys; print(json.load(sys.stdin)["debVersion"])')"
          fi
          bash tool/package_linux.sh
          desktop-file-validate linux/packaging/com.focubili.app.desktop
          ldd build/linux/x64/release/bundle/focubili | tee build/linux-packages/ldd.txt
          ! grep -q 'not found' build/linux-packages/ldd.txt
      - name: Verify Beta Debian metadata and package bytes
        if: inputs.beta_number != ''
        run: python3 tool/beta_release.py linux --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)" --folder build/linux-packages --output build/linux-packages/linux-beta-verification.json
      - name: Install generated DEB
        run: |
          packages=(build/linux-packages/*.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get install -y --no-install-recommends "./${packages[0]}"
      - name: Test normal application startup and single instance
        timeout-minutes: 3
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash tool/check_linux_launch.sh /usr/bin/focubili
      - name: Build standalone native runtime probe
        run: flutter build linux --release --target tool/linux_runtime_probe.dart
      - name: Test real Linux desktop services and media
        timeout-minutes: 8
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash tool/check_linux_runtime.sh
      - name: Compile isolated native subscription scheduler probe
        run: flutter build linux --release --target tool/native_subscription_probe.dart --dart-define=NATIVE_SUBSCRIPTION_PROBE=true
      - name: Verify GLib native timer callback and cancellation
        timeout-minutes: 2
        run: dbus-run-session -- xvfb-run -a python3 tool/run_native_subscription_probe.py build/linux/x64/release/bundle/focubili build/linux-packages/native-subscription.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focubili-linux-${{ inputs.source_sha || github.sha }}
          path: |
            build/linux-packages/*.deb
            build/linux-packages/*.tar.gz
            build/linux-packages/*.txt
            build/linux-packages/*.log
            build/linux-packages/*.png
            build/linux-packages/native-subscription.json
            build/linux-packages/linux-beta-verification.json
          if-no-files-found: warn
          retention-days: 30

name: FocuBili Release Build

on:
  push:
    branches:
      - master
    paths:
      - pubspec.yaml
      - .github/workflows/release-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focubili-release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: focubili-release-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release application
        run: flutter build windows --release --no-pub

      - name: Build Windows installer and portable package
        shell: pwsh
        run: .\windows\installer\build_windows_packages.ps1

      - name: Upload Windows release packages
        uses: actions/upload-artifact@v4
        with:
          name: focubili-release-windows
          path: |
            build/windows/x64/installer/*-setup.exe
            build/windows/x64/installer/*-portable.zip
          if-no-files-found: error
          retention-days: 7

name: FocuBili Release Build

on:
  push:
    branches:
      - master
    paths:
      - pubspec.yaml
      - docs/RELEASE_NOTES_v*.md
      - android/app/build.gradle
      - .github/workflows/release-build.yml
      - windows/installer/build_windows_packages.ps1
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      beta_number:
        type: string
        default: ''
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: false
      ANDROID_RELEASE_STORE_PASSWORD:
        required: false
      ANDROID_RELEASE_KEY_PASSWORD:
        required: false
      ANDROID_RELEASE_KEY_ALIAS:
        required: false

permissions:
  contents: read

concurrency:
  group: focubili-release-build-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.6'
  ANDROID_RELEASE_CERT_SHA256: '65EF1FB301FB1121C1803E752F5B1EB24E55846502D8B5478F0FC11F58E9A8A9'

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted source before accessing signing secrets
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'L1Xu4n/FocuBili'
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/master|workflow_dispatch:refs/heads/dev|workflow_dispatch:refs/heads/master) ;;
            *) echo 'Signed builds require a trusted branch invocation'; exit 1 ;;
          esac
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git merge-base --is-ancestor HEAD origin/dev || git merge-base --is-ancestor HEAD origin/master

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Android release signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/focubili-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
          } > android/key.properties
          chmod 600 "$keystore" android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # Flutter 3.44 skips release plugin regeneration with --no-pub.
        # Regenerate here so dev-only integration_test stays out of the APK.
        env:
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          dart tool/write_build_metadata.dart
          if test -n "$BETA_NUMBER"; then
            python3 tool/beta_release.py build --platform apk --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)"
          else
            flutter build apk --release
          fi

      - name: Verify release APK metadata
        shell: bash
        run: |
          apk='build/app/outputs/flutter-apk/app-release.apk'
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$apk"
          printf 'APK_SIZE=%s\n' "$(stat -c '%s' "$apk")"
          printf 'APK_SHA256=%s\n' "$(sha256sum "$apk" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          "$build_tools/aapt" dump badging "$apk" | grep '^package:'
          signer_output="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_output"
          # Newer apksigner versions report V2 Signer lines; keep the legacy format as a fallback.
          signer_count="$(printf '%s\n' "$signer_output" | sed -nE 's/^Number of signers: ([0-9]+)$/\1/p')"
          if test -z "$signer_count"; then
            signer_count="$(printf '%s\n' "$signer_output" | grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' || true)"
          fi
          test "$signer_count" -eq 1
          cert_sha256="$(printf '%s\n' "$signer_output" | sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]' | sort -u)"
          test "$cert_sha256" = "$ANDROID_RELEASE_CERT_SHA256"

      - name: Verify signed Beta preview identity
        if: inputs.beta_number != ''
        env:
          BETA_NUMBER: ${{ inputs.beta_number }}
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          python3 tool/beta_release.py android --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)" --apk build/app/outputs/flutter-apk/app-release.apk --aapt "$build_tools/aapt" --apksigner "$build_tools/apksigner" --output build/app/outputs/flutter-apk/android-beta-verification.json

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: focubili-release-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/android-beta-verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary release signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focubili-release.keystore" android/key.properties

  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release application
        env:
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          dart tool/write_build_metadata.dart
          if ($env:BETA_NUMBER) {
            python tool/beta_release.py build --platform windows --beta-number $env:BETA_NUMBER --source-sha (git rev-parse HEAD)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            flutter build windows --release --no-pub
          }

      - name: Build Windows installer and portable package
        shell: pwsh
        run: .\windows\installer\build_windows_packages.ps1

      - name: Verify Beta Windows metadata and portable bytes
        if: inputs.beta_number != ''
        env:
          BETA_NUMBER: ${{ inputs.beta_number }}
        shell: pwsh
        run: |
          $executable = 'build/windows/x64/runner/Release/FocuBili.exe'
          $identity = (Get-Item -LiteralPath $executable).VersionInfo
          $numericVersion = "$($identity.FileMajorPart).$($identity.FileMinorPart).$($identity.FileBuildPart).$($identity.FilePrivatePart)"
          python tool/beta_release.py windows --beta-number $env:BETA_NUMBER --source-sha (git rev-parse HEAD) --folder build/windows/x64/installer --executable $executable --product-version $identity.ProductVersion --file-version $numericVersion --output build/windows/x64/installer/windows-package-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows release packages
        uses: actions/upload-artifact@v4
        with:
          name: focubili-release-windows
          path: |
            build/windows/x64/installer/*-setup.exe
            build/windows/x64/installer/*-portable.zip
            build/windows/x64/installer/windows-package-verification.json
          if-no-files-found: error
          retention-days: 7

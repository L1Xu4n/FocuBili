name: Publish FocuBili Release

on:
  push:
    branches:
      - master
    paths:
      - docs/RELEASE_NOTES_v*.md
      - .github/workflows/publish-release.yml
      - tool/replace_linux_v181.py
      - tool/test_replace_linux_v181.py
      - tool/linux_v181_replacement_snapshot.json
  pull_request:
    branches: [dev, master]
    paths:
      - .github/workflows/publish-release.yml
      - tool/replace_linux_v181.py
      - tool/test_replace_linux_v181.py
      - tool/linux_v181_replacement_snapshot.json
  workflow_dispatch:
    inputs:
      linux_v181_phase:
        description: 'Repair only v1.8.1 Linux DEB; prepare before promote'
        required: true
        type: choice
        options: [prepare, promote]
      expected_sha256:
        description: 'Public candidate SHA256 independently verified before promote'
        type: string
        default: ''

permissions:
  actions: read
  contents: write

concurrency:
  group: focubili-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-linux-v181-publisher:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test reversible Linux asset replacement without network
        run: python3 -m unittest discover -s tool -p test_replace_linux_v181.py -v

  replace-linux-v181:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate-linux-v181-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependency scanner and target runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils python3 libgtk-3-0t64 libmpv2 libsecret-1-0 libasound2t64 libwebkit2gtk-4.1-0
      - name: Repair metadata or promote independently verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.linux_v181_phase }}
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
        run: python3 tool/replace_linux_v181.py "$PHASE" --expected-sha "$EXPECTED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-v181-replacement-${{ github.run_id }}
          path: build/linux-v181-replacement/
          retention-days: 90
          if-no-files-found: warn

  publish:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout final release metadata
        uses: actions/checkout@v6

      - name: Resolve version and successful build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          test -n "$version"
          notes="docs/RELEASE_NOTES_v${version}.md"
          test -f "$notes"
          # Only the exact release commit may supply tests and installation packages.
          python3 - <<'PY'
          import json, os, subprocess, time
          workflows = {'ci.yml': 'ci_run', 'release-build.yml': 'run_id',
                       'apple-build.yml': 'apple_run', 'linux-build.yml': 'linux_run'}
          deadline = time.monotonic() + 75 * 60
          while True:
              successful = {}
              for workflow, output in workflows.items():
                  runs = json.loads(subprocess.check_output([
                      'gh', 'run', 'list', '--workflow', workflow, '--branch', 'master',
                      '--commit', os.environ['GITHUB_SHA'], '--event', 'push', '--limit', '5',
                      '--json', 'databaseId,headSha,status,conclusion'], text=True))
                  run = next((run for run in runs if run['headSha'] == os.environ['GITHUB_SHA']), None)
                  if run and run['status'] == 'completed':
                      if run['conclusion'] != 'success':
                          raise SystemExit(f"Exact release commit failed {workflow}: {run['conclusion']}")
                      successful[output] = run['databaseId']
              if len(successful) == len(workflows):
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as destination:
                      for key, value in successful.items():
                          destination.write(f'{key}={value}\n')
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('Timed out waiting for exact release commit validation')
              print('Waiting for exact release commit validation', flush=True)
              time.sleep(30)
          PY
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Download verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
          APPLE_RUN: ${{ steps.release.outputs.apple_run }}
          LINUX_RUN: ${{ steps.release.outputs.linux_run }}
        shell: bash
        run: |
          gh run download "$RUN_ID" --name focubili-release-android --dir staging/android
          gh run download "$RUN_ID" --name focubili-release-windows --dir staging/windows
          gh run download "$APPLE_RUN" --name "focubili-apple-macos-${GITHUB_SHA}" --dir staging/macos
          gh run download "$APPLE_RUN" --name "focubili-apple-ios-${GITHUB_SHA}" --dir staging/ios
          gh run download "$LINUX_RUN" --name "focubili-linux-${GITHUB_SHA}" --dir staging/linux

      - name: Prepare public release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          mkdir release
          mv staging/android/app-release.apk "release/FocuBili-v${VERSION}-android.apk"
          mv "staging/windows/FocuBili-v${VERSION}-windows-x64-setup.exe" release/
          mv "staging/windows/FocuBili-v${VERSION}-windows-x64-portable.zip" release/
          mv staging/macos/FocuBili-macos-preview.dmg "release/FocuBili-v${VERSION}-macos-universal.dmg"
          mv staging/ios/FocuBili-ios-unsigned.ipa "release/FocuBili-v${VERSION}-ios-unsigned.ipa"
          mv "staging/linux/FocuBili-v${VERSION}-linux-amd64.deb" release/
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum release/*

      - name: Create annotated release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" -m "FocuBili v${VERSION}" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "FocuBili v${VERSION}" --notes-file "$NOTES"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "FocuBili v${VERSION}" --notes-file "$NOTES"
          fi

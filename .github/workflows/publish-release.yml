name: Publish FocuBili Release

on:
  push:
    branches:
      - master
    paths:
      - docs/RELEASE_NOTES_v*.md
      - .github/workflows/publish-release.yml
      - tool/release_asset_names.py
      - tool/test_publish_release_assets.py
  pull_request:
    branches: [dev, master]
    paths:
      - .github/workflows/publish-release.yml
      - tool/release_asset_names.py
      - tool/test_publish_release_assets.py

permissions:
  actions: read
  contents: write

concurrency:
  group: focubili-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keep the existing check name for branch rules and run history.
  validate-linux-v181-publisher:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test stable public asset names and legacy links without network
        run: python3 -m unittest discover -s tool -p test_publish_release_assets.py -v

  publish:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
    needs: validate-linux-v181-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout final release metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and successful build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          full_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml)"
          test -n "$full_version"
          version="${full_version%+*}"
          if test "$version" = '1.9.0'; then
            echo 'v1.9.0 has already been corrected and published; use a new release version.' >&2
            exit 1
          fi
          notes="docs/RELEASE_NOTES_v${version}.md"
          test -f "$notes"
          # Only the exact release commit may supply tests and installation packages.
          python3 - <<'PY'
          import json, os, subprocess, time
          workflows = {'ci.yml': 'ci_run', 'release-build.yml': 'run_id',
                       'apple-build.yml': 'apple_run', 'linux-build.yml': 'linux_run'}
          deadline = time.monotonic() + 75 * 60
          while True:
              successful = {}
              for workflow, output in workflows.items():
                  runs = json.loads(subprocess.check_output([
                      'gh', 'run', 'list', '--workflow', workflow, '--branch', 'master',
                      '--commit', os.environ['GITHUB_SHA'], '--event', 'push', '--limit', '5',
                      '--json', 'databaseId,headSha,status,conclusion'], text=True))
                  run = next((run for run in runs if run['headSha'] == os.environ['GITHUB_SHA']), None)
                  if run and run['status'] == 'completed':
                      if run['conclusion'] != 'success':
                          raise SystemExit(f"Exact release commit failed {workflow}: {run['conclusion']}")
                      successful[output] = run['databaseId']
              if len(successful) == len(workflows):
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as destination:
                      for key, value in successful.items():
                          destination.write(f'{key}={value}\n')
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('Timed out waiting for exact release commit validation')
              print('Waiting for exact release commit validation', flush=True)
              time.sleep(30)
          PY
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'full_version=%s\n' "$full_version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Download verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
          APPLE_RUN: ${{ steps.release.outputs.apple_run }}
          LINUX_RUN: ${{ steps.release.outputs.linux_run }}
        shell: bash
        run: |
          gh run download "$RUN_ID" --name focubili-release-android --dir staging/android
          gh run download "$RUN_ID" --name focubili-release-windows --dir staging/windows
          gh run download "$APPLE_RUN" --name "focubili-apple-macos-${GITHUB_SHA}" --dir staging/macos
          gh run download "$APPLE_RUN" --name "focubili-apple-ios-${GITHUB_SHA}" --dir staging/ios
          gh run download "$LINUX_RUN" --name "focubili-linux-${GITHUB_SHA}" --dir staging/linux

      - name: Prepare public release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FULL_VERSION: ${{ steps.release.outputs.full_version }}
        shell: bash
        run: |
          test "${FULL_VERSION%+*}" = "$VERSION"
          prefix="$(python3 tool/release_asset_names.py "$FULL_VERSION")"
          mkdir release
          mv staging/android/app-release.apk "release/${prefix}-android.apk"
          mv "staging/windows/FocuBili-v${VERSION}-windows-x64-setup.exe" "release/${prefix}-windows-x64-setup.exe"
          mv "staging/windows/FocuBili-v${VERSION}-windows-x64-portable.zip" "release/${prefix}-windows-x64-portable.zip"
          mv staging/macos/FocuBili-macos-preview.dmg "release/${prefix}-macos-universal.dmg"
          mv staging/ios/FocuBili-ios-unsigned.ipa "release/${prefix}-ios-unsigned.ipa"
          mv "staging/linux/FocuBili-v${VERSION}-linux-amd64.deb" "release/${prefix}-linux-amd64.deb"
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum release/*

      - name: Create annotated release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" -m "FocuBili v${VERSION}" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          # Existing releases are immutable from this publisher's perspective.
          # A retry may verify identical published bytes, never add/replace assets.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > existing-releases.json
          if python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          pages = json.loads(Path('existing-releases.json').read_text())
          if not isinstance(pages, list) or not pages or not all(isinstance(p, list) for p in pages):
              sys.exit('Malformed release inventory. No changes made.')
          entries = [r for page in pages for r in page]
          if not all(isinstance(r, dict) and isinstance(r.get('tag_name'), str) for r in entries):
              sys.exit('Malformed release identity. No changes made.')
          matches = [r for r in entries if r['tag_name'] == os.environ['TAG']]
          if not matches:
              sys.exit(3)
          if len(matches) != 1:
              sys.exit('Unexpected duplicate release for tag. No changes made.')
          expected = {}
          for path in Path('release').iterdir():
              with path.open('rb') as stream:
                  expected[path.name] = (path.stat().st_size, 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest())
          release = matches[0]
          assets = {a['name']: (a['size'], a['digest']) for a in release['assets'] if a['state'] == 'uploaded'}
          if (release['draft'] or release['prerelease'] or len(release['assets']) != len(expected)
                  or assets != expected):
              sys.exit('Existing release differs. No changes made; inspect it manually.')
          print('Existing release and all six published assets already match; no changes made.')
          PY
          then
            exit 0
          else
            status=$?
            test "$status" -eq 3
          fi
          gh release create "$TAG" release/* --verify-tag --title "FocuBili v${VERSION}" --notes-file "$NOTES"

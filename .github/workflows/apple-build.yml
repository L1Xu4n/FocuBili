name: Apple builds
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master, "iOS＆MacOS"]
    paths: ['ios/**', 'macos/**', 'packages/focubili_apple/**', 'lib/**', 'integration_test/**', 'assets/icon/**', 'tool/**', 'pubspec.*', '.github/workflows/apple-build.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      beta_number:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: apple-${{ inputs.source_sha && format('beta-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      # Automatic events also run ci.yml; keep complete checks for manual Apple runs.
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: python3 tool/check_apple_sources.py
      - run: python3 tool/check_platform_icons.py
      - run: python3 -m unittest discover -s tool -p test_verify_macos_dmg.py -v
      - run: python3 -m unittest discover -s tool -p test_native_subscription_probe.py -v
      - run: flutter pub get
        if: github.event_name == 'workflow_dispatch'
      - run: dart format --output=none --set-exit-if-changed lib test
        if: github.event_name == 'workflow_dispatch'
      - run: flutter analyze --no-pub
        if: github.event_name == 'workflow_dispatch'
      - run: flutter test --no-pub
        if: github.event_name == 'workflow_dispatch'
  apple:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BETA_NUMBER: ${{ inputs.beta_number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-26
          - platform: macos
            os: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Select Xcode 26 for Apple runtime checks
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get
      - name: Verify native subscription cancellation and generation policy
        if: matrix.platform == 'macos'
        run: |
          swiftc packages/focubili_apple/ios/Classes/SubscriptionRunGate.swift tool/subscription_gate_probe.swift -o "$RUNNER_TEMP/subscription-gate-probe"
          "$RUNNER_TEMP/subscription-gate-probe"
      - name: Check cache locking and subtitle lifecycle on macOS
        if: matrix.platform == 'macos'
        run: flutter test --no-pub test/cache_file_lock_test.dart test/image_resource_cache_test.dart test/cached_player_overlay_service_test.dart test/windows_media_cache_service_test.dart test/desktop_disk_cache_session_test.dart
      - name: Build iOS device archive (unsigned)
        if: matrix.platform == 'ios'
        run: |
          dart tool/write_build_metadata.dart
          if test -n "$BETA_NUMBER"; then
            python3 tool/beta_release.py build --platform ios --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)"
          else
            flutter build ios --release --no-codesign
          fi
          mkdir -p build/apple/Payload
          cp -R build/ios/iphoneos/Runner.app build/apple/Payload/
          cd build/apple
          ditto -c -k --sequesterRsrc --keepParent Payload FocuBili-ios-unsigned.ipa
          rm -rf Payload
          printf '%s\n' 'Unsigned developer build. Requires your own Apple signing/provisioning before iPhone installation. Not an App Store/TestFlight package.' > INSTALL.txt
          shasum -a 256 FocuBili-ios-unsigned.ipa > SHA256SUMS.txt
      - name: Verify unsigned Beta iOS bundle metadata
        if: matrix.platform == 'ios' && inputs.beta_number != ''
        run: python3 tool/beta_release.py ios --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)" --ipa build/apple/FocuBili-ios-unsigned.ipa --output build/apple/ios-beta-verification.json
      - name: Compile iOS simulator
        if: matrix.platform == 'ios'
        run: |
          if test -n "$BETA_NUMBER"; then
            python3 tool/beta_release.py build --platform ios-simulator --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)"
          else
            flutter build ios --simulator --debug
          fi
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/apple/FocuBili-ios-simulator.zip
      - name: Smoke-test iOS launch on simulator
        if: matrix.platform == 'ios'
        timeout-minutes: 25
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for k in sorted(d["devices"], reverse=True) for x in d["devices"][k] if x.get("isAvailable")]; v=next((x for x in a if x["name"].startswith("iPad")), next(x for x in a if x["name"].startswith("iPhone"))); print("Smoke device: "+v["name"], file=sys.stderr); print(v["udid"])')"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device" com.focubili.app
          sleep 15
          xcrun simctl io "$device" screenshot build/apple/ios-launch.png
          xcrun simctl spawn "$device" launchctl list | grep com.focubili.app
          bash tool/check_ios_runtime.sh "$device"
          bash tool/check_ios_subscription_scheduler.sh "$device"
      - name: Build and package macOS
        if: matrix.platform == 'macos'
        run: |
          dart tool/write_build_metadata.dart
          if test -n "$BETA_NUMBER"; then
            python3 tool/beta_release.py build --platform macos --beta-number "$BETA_NUMBER" --source-sha "$(git rev-parse HEAD)"
          else
            flutter build macos --release
          fi
          mkdir -p build/apple/dmg
          ditto build/macos/Build/Products/Release/FocuBili.app build/apple/dmg/FocuBili.app
          codesign --verify --deep --strict build/apple/dmg/FocuBili.app
          ln -s /Applications build/apple/dmg/Applications
          printf '%s\n' 'Developer preview, ad-hoc signed, not notarized. macOS may restrict launch. Use a Developer ID signed/notarized build for trusted distribution; do not disable system security globally.' > build/apple/dmg/README.txt
          hdiutil create -volname FocuBili -srcfolder build/apple/dmg -ov -format UDZO build/apple/FocuBili-macos-preview.dmg
          rm -rf build/apple/dmg
          shasum -a 256 build/apple/FocuBili-macos-preview.dmg > build/apple/SHA256SUMS.txt
      - name: Verify normal macOS DMG contents and identity
        if: matrix.platform == 'macos'
        run: python3 tool/verify_macos_dmg.py
      - name: Smoke-test macOS launch
        if: matrix.platform == 'macos'
        timeout-minutes: 15
        run: |
          app="$PWD/build/macos/Build/Products/Release/FocuBili.app"
          open -n "$app"
          sleep 15
          pgrep -f '/FocuBili.app/Contents/MacOS/FocuBili'
          screencapture -x build/apple/macos-launch.png
          pkill -f '/FocuBili.app/Contents/MacOS/FocuBili' || true
          flutter build macos --release --target=tool/apple_runtime_probe.dart
          python3 - <<'PYRUN'
          import subprocess, pathlib, time
          log = pathlib.Path('build/apple/macos-runtime.log')
          captured = set()
          with log.open('w') as stream:
              run = subprocess.Popen(['build/macos/Build/Products/Release/FocuBili.app/Contents/MacOS/FocuBili'], text=True, stdout=stream, stderr=subprocess.STDOUT)
              deadline = time.monotonic() + 150
              while run.poll() is None:
                  output = log.read_text(errors='replace')
                  for marker, filename in [('APPLE_VIDEO_WINDOW_READY_FOR_SCREENSHOT', 'macos-video-window.png'), ('APPLE_FLOATING_READY_FOR_SCREENSHOT', 'macos-floating-video-window.png')]:
                      if marker not in captured and marker in output:
                          time.sleep(.75)  # Allow the window transition to reach a rendered frame.
                          subprocess.run(['screencapture', '-x', 'build/apple/' + filename], timeout=10, check=True)
                          captured.add(marker)
                  if time.monotonic() > deadline:
                      run.kill(); run.wait(); raise TimeoutError('Native runtime probe')
                  time.sleep(.1)
          output = log.read_text(errors='replace')
          print(output)
          if run.returncode != 0:
              trace = subprocess.run(['xcrun', 'lldb', '--batch', '-o', 'run', '-o', 'thread backtrace all', '--', 'build/macos/Build/Products/Release/FocuBili.app/Contents/MacOS/FocuBili'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=150)
              pathlib.Path('build/apple/macos-native-backtrace.log').write_text(trace.stdout)
              print(trace.stdout[-24000:])
          assert run.returncode == 0, f'Native probe exited {run.returncode}'
          assert 'APPLE_RUNTIME_ALL_CHECKS_PASSED' in output, 'Probe did not complete'
          PYRUN
      - name: Verify macOS native subscription timer callback and cancellation
        if: matrix.platform == 'macos'
        timeout-minutes: 10
        run: |
          flutter build macos --release --target tool/native_subscription_probe.dart --dart-define=NATIVE_SUBSCRIPTION_PROBE=true
          python3 tool/run_native_subscription_probe.py build/macos/Build/Products/Release/FocuBili.app/Contents/MacOS/FocuBili build/apple/native-subscription.log
      - name: Preserve native failure diagnostics
        if: failure()
        shell: bash
        run: |
          sleep 10
          mkdir -p build/apple-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -iname '*FocuBili*' -exec cp {} build/apple-diagnostics/ \; 2>/dev/null || true
          cp build/apple/*.log build/apple-diagnostics/ 2>/dev/null || true
          cp build/apple/*-result.json build/apple-diagnostics/ 2>/dev/null || true
          cp build/apple/*-launch.png build/apple-diagnostics/ 2>/dev/null || true
          cp build/apple/*-window.png build/apple-diagnostics/ 2>/dev/null || true
          for f in build/apple-diagnostics/*.ips; do
            test -f "$f" || continue
            head -c 22000 "$f"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-diagnostics-${{ matrix.platform }}-${{ github.sha }}
          path: build/apple-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: focubili-apple-${{ matrix.platform }}-${{ inputs.source_sha || github.sha }}
          path: build/apple/
          if-no-files-found: error
          retention-days: 30

name: Apple builds
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths: ['ios/**', 'macos/**', 'packages/focubili_apple/**', 'lib/**', 'pubspec.*', '.github/workflows/apple-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: python3 tool/check_apple_sources.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  apple:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: python3 tool/check_apple_sources.py
      - run: flutter pub get
      - name: Build iOS device archive (unsigned)
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/apple/Payload
          cp -R build/ios/iphoneos/Runner.app build/apple/Payload/
          cd build/apple
          ditto -c -k --sequesterRsrc --keepParent Payload FocuBili-ios-unsigned.ipa
          rm -rf Payload
          printf '%s\n' 'Unsigned developer build. Requires your own Apple signing/provisioning before iPhone installation. Not an App Store/TestFlight package.' > INSTALL.txt
          shasum -a 256 FocuBili-ios-unsigned.ipa > SHA256SUMS.txt
      - name: Compile iOS simulator
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --simulator --debug
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/apple/FocuBili-ios-simulator.zip
      - name: Smoke-test iOS launch on simulator
        if: matrix.platform == 'ios'
        timeout-minutes: 10
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if x.get("isAvailable") and x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device" com.focubili.app
          sleep 15
          xcrun simctl io "$device" screenshot build/apple/ios-launch.png
          xcrun simctl spawn "$device" launchctl list | grep com.focubili.app
          flutter test integration_test/apple_smoke_test.dart -d "$device"
          xcrun simctl shutdown "$device"
      - name: Build and package macOS
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          mkdir -p build/apple/dmg
          ditto build/macos/Build/Products/Release/FocuBili.app build/apple/dmg/FocuBili.app
          codesign --verify --deep --strict build/apple/dmg/FocuBili.app
          ln -s /Applications build/apple/dmg/Applications
          printf '%s\n' 'Developer preview, ad-hoc signed, not notarized. macOS may restrict launch. Use a Developer ID signed/notarized build for trusted distribution; do not disable system security globally.' > build/apple/dmg/README.txt
          hdiutil create -volname FocuBili -srcfolder build/apple/dmg -ov -format UDZO build/apple/FocuBili-macos-preview.dmg
          rm -rf build/apple/dmg
          shasum -a 256 build/apple/FocuBili-macos-preview.dmg > build/apple/SHA256SUMS.txt
      - name: Smoke-test macOS launch
        if: matrix.platform == 'macos'
        timeout-minutes: 15
        run: |
          app="$PWD/build/macos/Build/Products/Release/FocuBili.app"
          open -n "$app"
          sleep 15
          pgrep -f '/FocuBili.app/Contents/MacOS/FocuBili'
          screencapture -x build/apple/macos-launch.png
          pkill -f '/FocuBili.app/Contents/MacOS/FocuBili' || true
          flutter build macos --release --target=tool/apple_runtime_probe.dart
          python3 - <<'PYRUN'
          import subprocess, pathlib
          run = subprocess.run(['build/macos/Build/Products/Release/FocuBili.app/Contents/MacOS/FocuBili'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=150)
          pathlib.Path('build/apple/macos-runtime.log').write_text(run.stdout)
          print(run.stdout)
          assert run.returncode == 0, f'Native probe exited {run.returncode}'
          assert 'APPLE_RUNTIME_ALL_CHECKS_PASSED' in run.stdout, 'Probe did not complete'
          PYRUN
      - name: Preserve native failure diagnostics
        if: failure()
        shell: bash
        run: |
          sleep 10
          mkdir -p build/apple-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -iname '*FocuBili*' -exec cp {} build/apple-diagnostics/ \; 2>/dev/null || true
          cp build/apple/*-launch.png build/apple-diagnostics/ 2>/dev/null || true
          for f in build/apple-diagnostics/*.ips; do
            test -f "$f" || continue
            head -c 22000 "$f"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-diagnostics-${{ matrix.platform }}-${{ github.sha }}
          path: build/apple-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: focubili-apple-${{ matrix.platform }}-${{ github.sha }}
          path: build/apple/
          if-no-files-found: error
          retention-days: 30

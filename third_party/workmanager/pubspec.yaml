name: workmanager
description: Android-only frontend for FocuBili background subscriptions.
version: 0.10.10
publish_to: none
homepage: https://github.com/fluttercommunity/flutter_workmanager

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  workmanager_platform_interface: 0.10.5
  workmanager_android: 0.10.9

flutter:
  plugin:
    platforms:
      android:
        default_package: workmanager_android

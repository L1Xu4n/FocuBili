name: focubili_apple
description: Native Apple integration for FocuBili.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FocuBiliApplePlugin
      macos:
        pluginClass: FocuBiliApplePlugin

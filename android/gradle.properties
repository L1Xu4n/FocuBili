# 构建内存上限；低内存沙箱中 4G 堆叠加 Kotlin 编译会触发 OOM，收窄后仍可完成打包。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
# Kotlin 编译无需独立守护进程，在主进程内执行以降低低内存沙箱的峰值占用。
kotlin.compiler.execution.strategy=in-process
# 沙箱仅 3 核；限制并发 Worker 数量降低峰值内存。
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
# 项目目录含中文；允许 Android Gradle 插件在 Windows 下继续构建该项目。
android.overridePathCheck=true
# Flutter 迁移器加入：继续使用当前项目的 Kotlin Gradle 插件实现。
android.builtInKotlin=false
# Flutter 迁移器加入：继续兼容当前项目使用的旧版 Android DSL。
android.newDsl=false
